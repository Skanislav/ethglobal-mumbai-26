<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#EEF1F7" />
    <meta
      name="description"
      content="safelyfy — one wallet for the whole family. A Safe multisig assembled from the keys you already have: passkeys, phone wallets, NFC chips, Ledger and Trezor."
    />
    <title>safelyfy — one wallet for the whole family</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // The Trezor transport vendors Node's `readable-stream`, which reads
      // `process.browser`, `process.version` and `process.nextTick` at module
      // evaluation. This shim must run before any module, so it lives here rather
      // than in a `.ts` file that is itself a module.
      if (typeof window !== 'undefined' && !window.process) {
        window.process = {
          browser: true,
          version: '',
          versions: {},
          env: { NODE_ENV: 'production' },
          nextTick: function (fn) {
            var args = Array.prototype.slice.call(arguments, 1);
            Promise.resolve().then(function () {
              fn.apply(null, args);
            });
          },
        };
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
